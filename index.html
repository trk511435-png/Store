<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متجر آساي - Acai Bowls</title>
    <style>
        body {
            font-family: Tahoma, sans-serif;
            background-color: #fdfbf7;
            margin: 0;
            padding: 20px;
            color: #333;
        }
        header {
            text-align: center;
            margin-bottom: 30px;
        }
        /* تصميم الشعار مع مؤشر النقر */
        #logo {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            object-fit: cover;
            cursor: pointer;
            border: 3px solid #6b2d5c;
            transition: transform 0.2s;
        }
        #logo:hover {
            transform: scale(1.05);
        }
        h1 {
            color: #6b2d5c;
            margin-top: 10px;
        }
        .products-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            max-width: 900px;
            margin: 0 auto;
        }
        .product-card {
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            padding: 15px;
            text-align: center;
            border: 1px solid #eee;
        }
        .product-card img {
            width: 100%;
            height: 140px;
            object-fit: cover;
            border-radius: 8px;
        }
        .product-card h3 {
            margin: 10px 0 5px;
            font-size: 18px;
            color: #444;
        }
        .price {
            color: #6b2d5c;
            font-weight: bold;
            margin-bottom: 10px;
        }
        .btn-add {
            background-color: #6b2d5c;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            font-size: 14px;
        }
        .btn-add:hover {
            background-color: #542247;
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <header>
        <!-- الشعار الجديد (انقر عليه مرتين لفتح صفحة الأدمن) -->
        <img src="https://images.unsplash.com/photo-1590301157890-4810ed352733?w=500" alt="شعار متجر آساي" id="logo" title="انقر مرتين لفتح لوحة التحكم">
        <h1>Acai Bowls</h1>
        <p>أهلاً بك في متجر الآساي المنعش والطازج</p>
    </header>

    <main>
        <div class="products-container">
            <!-- منتج 1 -->
            <div class="product-card">
                <img src="https://images.unsplash.com/photo-1590301157890-4810ed352733?w=500" alt="آساي كلاسيك">
                <h3>آساي كلاسيك بوبولار</h3>
                <div class="price">25 درهم</div>
                <button class="btn-add">إضافة للسلة</button>
            </div>

            <!-- منتج 2 -->
            <div class="product-card">
                <img src="https://images.unsplash.com/photo-1546069901-ba9599a7e63c?w=500" alt="آساي فواكه مشكلة">
                <h3>آساي مع الفواكه الطازجة</h3>
                <div class="price">30 درهم</div>
                <button class="btn-add">إضافة للسلة</button>
            </div>

            <!-- منتج 3 -->
            <div class="product-card">
                <img src="https://images.unsplash.com/photo-1511690656952-34342bb7c2f2?w=500" alt="آساي توت وجرانولا">
                <h3>آساي جرانولا وتوت</h3>
                <div class="price">28 درهم</div>
                <button class="btn-add">إضافة للسلة</button>
            </div>
        </div>
    </main>

    <script>
        // إعدادات لوحة التحكم المخفية عبر النقر المزدوج على الشعار
        const ADMIN_PASSWORD = "admin123"; // استبدلها بكلمة المرور التي تناسبك
        const ADMIN_PAGE_URL = "admin.html"; // رابط صفحة الأدمن لديك

        document.getElementById("logo").addEventListener("dblclick", function() {
            let password = prompt("الرجاء إدخال كلمة مرور لوحة التحكم:");
            
            if (password === null) {
                return; // المستخدم ألغى العملية
            }
            
            if (password === ADMIN_PASSWORD) {
                alert("كلمة المرور صحيحة، جاري فتح لوحة التحكم...");
                window.location.href = ADMIN_PAGE_URL;
            } else {
                alert("كلمة المرور غير صحيحة!");
            }
        });
    </script>

</body>
</html>
