<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أساي بولة - نظام الطلب والاستلام</title>
    <style>
        body {
            font-family: Tahoma, sans-serif;
            background-color: #fdfbf7;
            margin: 0;
            padding: 15px;
            color: #333;
        }
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #fff;
            padding: 10px 15px;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 10px;
        }
        .badge-btn {
            background-color: #ffebee;
            color: #c62828;
            border: 1px solid #ffcdd2;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: bold;
        }
        .status-online {
            color: #2e7d32;
            font-size: 13px;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .status-online::before {
            content: '';
            width: 8px;
            height: 8px;
            background-color: #4caf50;
            border-radius: 50%;
            display: inline-block;
        }
        /* الشعار الصحيح مع مؤشر النقر المزدوج للأدمن */
        .store-logo {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            object-fit: cover;
            cursor: pointer;
            border: 2px solid #6b2d5c;
        }
        .store-title-area {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .main-layout {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 20px;
            max-width: 1100px;
            margin: 0 auto;
        }
        @media (max-width: 768px) {
            .main-layout {
                grid-template-columns: 1fr;
            }
        }
        .cart-box, .menu-section {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            border: 1px solid #eee;
        }
        .cart-title {
            font-weight: bold;
            font-size: 18px;
            margin-bottom: 15px;
            border-bottom: 2px solid #f0f0f0;
            padding-bottom: 8px;
            text-align: right;
        }
        .cart-empty {
            color: #888;
            text-align: center;
            padding: 20px 0;
            font-size: 14px;
        }
        .cart-summary-row {
            display: flex;
            justify-content: space-between;
            margin: 10px 0;
            font-size: 14px;
        }
        .cart-total {
            font-weight: bold;
            font-size: 16px;
            color: #000;
            border-top: 1px dashed #ddd;
            padding-top: 10px;
            margin-top: 10px;
        }
        .checkout-btn {
            background-color: #6b2d5c;
            color: white;
            border: none;
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 15px;
        }
        .categories-bar {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .cat-btn {
            background: #f5f5f5;
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 13px;
            color: #555;
        }
        .cat-btn.active {
            background-color: #6b2d5c;
            color: white;
        }
        .banner-img {
            width: 100%;
            height: 220px;
            object-fit: cover;
            border-radius: 10px;
            margin-bottom: 15px;
        }
        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
        }
        .product-item {
            border: 1px solid #eee;
            border-radius: 8px;
            padding: 12px;
            text-align: center;
            background: #fff;
        }
        .product-item img {
            width: 100%;
            height: 120px;
            object-fit: cover;
            border-radius: 6px;
        }
        .product-name {
            font-weight: bold;
            font-size: 15px;
            margin: 8px 0;
        }
        .product-price {
            color: #6b2d5c;
            font-weight: bold;
            margin-bottom: 10px;
        }
        .add-to-cart-btn {
            background-color: #fce4ec;
            color: #6b2d5c;
            border: 1px solid #f8bbd0;
            width: 100%;
            padding: 6px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 13px;
            font-weight: bold;
        }
        .add-to-cart-btn:hover {
            background-color: #6b2d5c;
            color: white;
        }
    </style>
</head>
<body>

    <!-- الشريط العلوي (الهيدر بنفس تفاصيلك) -->
    <div class="top-bar">
        <div style="display: flex; align-items: center; gap: 15px;">
            <div class="badge-btn"> بطاقة الولاء ( 0 / 3 )</div>
            <div class="status-online">متصل بالسحاب</div>
        </div>
        <div class="store-title-area">
            <div style="text-align: left;">
                <div style="font-weight: bold; font-size: 14px; color: #6b2d5c;">Acai Bowls</div>
                <div style="font-size: 11px; color: #666;">اطلب واستلم من البوت (متصل سحابياً)</div>
            </div>
            <!-- الشعار الصحيح (انقر عليه مرتين لفتح لوحة الأدمن) -->
            <img src="https://images.unsplash.com/photo-1590301157890-4810ed352733?w=500" alt="شعار المتجر" id="storeLogo" class="store-logo" title="انقر مرتين لفتح لوحة التحكم">
        </div>
    </div>

    <!-- التخطيط الرئيسي (ملخص الطلب يمين/يسار وقائمة المنتجات) -->
    <div class="main-layout">
        
        <!-- صندوق ملخص الطلب -->
        <div class="cart-box">
            <div class="cart-title">ملخص الطلب</div>
            <div class="cart-empty">السلة فارغة، اختر أساي أو إضافة!</div>
            <div class="cart-summary-row">
                <span>المجموع الفرعي:</span>
                <span>0.00 درهم</span>
            </div>
            <div class="cart-summary-row">
                <span>الضريبة:</span>
                <span>0.00 درهم</span>
            </div>
            <div class="cart-summary-row cart-total">
                <span>الإجمالي النهائي:</span>
                <span>0.00 درهم</span>
            </div>
            <button class="checkout-btn">إرسال الطلب (دفع نقدي بالبوت) 🛒</button>
        </div>

        <!-- قسم القائمة والمنتجات -->
        <div class="menu-section">
            <!-- أزرار التصنيفات -->
            <div class="categories-bar">
                <button class="cat-btn active">جميع المنتجات</button>
                <button class="cat-btn">أكواب الأساي الرئيسية</button>
                <button class="cat-btn">الإضافات الأخرى (+1 درهم)</button>
            </div>

            <!-- بانر عرض مميز -->
            <img src="https://images.unsplash.com/photo-1590301157890-4810ed352733?w=800" alt="بانر آساي" class="banner-img">
            <div style="text-align: center; font-weight: bold; color: #6b2d5c; margin-bottom: 20px;">⭐ قائمة المنيو الرسمية المعتمدة ⭐</div>

            <!-- شبكة المنتجات (بصور الآساي الحقيقية والمنسقة) -->
            <div class="product-grid">
                <div class="product-item">
                    <img src="https://images.unsplash.com/photo-1511690656952-34342bb7c2f2?w=500" alt="آساي مقاس صغير">
                    <div class="product-name">آساي مقاس صغير</div>
                    <div class="product-price">3 دراهم</div>
                    <button class="add-to-cart-btn">إضافة للسلة</button>
                </div>

                <div class="product-item">
                    <img src="https://images.unsplash.com/photo-1546069901-ba9599a7e63c?w=500" alt="آساي مقاس كبير">
                    <div class="product-name">آساي مقاس كبير</div>
                    <div class="product-price">5 دراهم</div>
                    <button class="add-to-cart-btn">إضافة للسلة</button>
                </div>

                <div class="product-item">
                    <img src="https://images.unsplash.com/photo-1590301157890-4810ed352733?w=500" alt="جرانولا">
                    <div class="product-name">جرانولا</div>
                    <div class="product-price">1 درهم</div>
                    <button class="add-to-cart-btn">إضافة للسلة</button>
                </div>
            </div>
        </div>

    </div>

    <script>
        // كود فتح صفحة الأدمن المخفية بالنقر المزدوج (مرتين متتاليتين) على الشعار
        const ADMIN_PASSWORD = "admin123"; // كلمة المرور الخاصة بك
        const ADMIN_PAGE_URL = "admin.html"; // رابط صفحة الأدمن

        document.getElementById("storeLogo").addEventListener("dblclick", function() {
            let password = prompt("الرجاء إدخال كلمة مرور لوحة التحكم:");
            
            if (password === null) {
                return; // إلغاء
            }
            
            if (password === ADMIN_PASSWORD) {
                alert("كلمة المرور صحيحة، جاري فتح لوحة التحكم...");
                window.location.href = ADMIN_PAGE_URL;
            } else {
                alert("كلمة المرور غير صحيحة!");
            }
        });
    </script>

</body>
</html>
