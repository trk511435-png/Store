<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متجر أساي - Acai Bowls</title>
    <style>
        body {
            font-family: Tahoma, sans-serif;
            background-color: #fcf8f7;
            margin: 0;
            padding: 0;
            color: #333;
            text-align: center;
        }
        header {
            background-color: #fff;
            padding: 20px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            cursor: pointer;
        }
        .logo {
            font-size: 24px;
            font-weight: bold;
            color: #6a1b39;
        }
        .container {
            max-width: 600px;
            margin: 20px auto;
            padding: 15px;
        }
        .menu-section {
            display: flex;
            justify-content: space-around;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 20px;
        }
        .card {
            background: #fff;
            border-radius: 15px;
            padding: 15px;
            width: 45%;
            box-shadow: 0 4px 10px rgba(0,0,0,0.08);
            text-align: center;
        }
        .card h3 {
            margin: 10px 0 5px;
            color: #6a1b39;
        }
        .price {
            background-color: #a93255;
            color: white;
            padding: 5px 15px;
            border-radius: 20px;
            display: inline-block;
            margin: 10px 0;
            font-weight: bold;
        }
        .addons-box {
            background: #fff;
            border-radius: 15px;
            padding: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.08);
            margin-bottom: 20px;
            text-align: right;
        }
        .addons-box h3 {
            text-align: center;
            color: #6a1b39;
        }
        .addon-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 8px 0;
            padding: 5px;
            border-bottom: 1px solid #eee;
        }
        .btn {
            background-color: #6a1b39;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            border-radius: 25px;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
        }
        .btn:hover {
            background-color: #4e1229;
        }
        /* لوحة الآدمن */
        #admin-panel {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        .admin-content {
            background: white;
            padding: 20px;
            border-radius: 10px;
            width: 80%;
            max-width: 500px;
            text-align: right;
            max-height: 80vh;
            overflow-y: auto;
        }
        .close-admin {
            background: red;
            color: white;
            border: none;
            padding: 5px 10px;
            cursor: pointer;
            float: left;
            border-radius: 5px;
        }
    </style>
</head>
<body>

    <!-- شعار المتجر (انقر مرتين لفتح صفحة الآدمن) -->
    <header ondblclick="openAdminLogin()">
        <div class="logo">🍇 Acai Bowls متجر الأساي</div>
        <p style="font-size: 12px; color: #888; margin: 5px 0 0;">انقر مرتين على الشعار للدخول للآدمن</p>
    </header>

    <div class="container">
        <!-- قسم الأطباق -->
        <div class="menu-section">
            <div class="card">
                <h3>أساي مقاس صغير</h3>
                <div class="price">3 دراهم</div>
                <label><input type="checkbox" class="bowl-select" data-name="أساي صغير" data-price="3"> اختر</label>
            </div>
            <div class="card">
                <h3>أساي مقاس كبير</h3>
                <div class="price">5 دراهم</div>
                <label><input type="checkbox" class="bowl-select" data-name="أساي كبير" data-price="5"> اختر</label>
            </div>
        </div>

        <!-- قسم الإضافات -->
        <div class="addons-box">
            <h3>إضافات أخرى (+1 درهم لكل إضافة)[span_2](start_span)[span_2](end_span)</h3>
            <div class="addon-item">
                <span>🍌 موز</span>
                <input type="checkbox" class="addon-select" data-name="موز" data-price="1">
            </div>
            <div class="addon-item">
                <span>🍓 فراولة</span>
                <input type="checkbox" class="addon-select" data-name="فراولة" data-price="1">
            </div>
            <div class="addon-item">
                <span>🫐 توت أزرق</span>
                <input type="checkbox" class="addon-select" data-name="توت أزرق" data-price="1">
            </div>
            <div class="addon-item">
                <span>🥜 جرانولا</span>
                <input type="checkbox" class="addon-select" data-name="جرانولا" data-price="1">
            </div>
            <div class="addon-item">
                <span>🥥 جوز هند</span>
                <input type="checkbox" class="addon-select" data-name="جوز هند" data-price="1">
            </div>
        </div>

        <button class="btn" onclick="submitOrder()">إتمام الطلب</button>
    </div>

    <!-- لوحة الآدمن -->
    <div id="admin-panel">
        <div class="admin-content">
            <button class="close-admin" onclick="closeAdmin()">إغلاق</button>
            <h2>لوحة إدارة الطلبات</h2>
            <div id="orders-list">جاري تحميل الطلبات...</div>
        </div>
    </div>

    <script>
        // إتمام الطلب وإرساله للسيرفر
        function submitOrder() {
            let selectedBowls = [];
            document.querySelectorAll('.bowl-select:checked').forEach(el => {
                selectedBowls.push({ name: el.dataset.name, price: el.dataset.price });
            });

            let selectedAddons = [];
            document.querySelectorAll('.addon-select:checked').forEach(el => {
                selectedAddons.push({ name: el.dataset.name, price: el.dataset.price });
            });

            if (selectedBowls.length === 0) {
                alert('الرجاء اختيار حجم أساي واحد على الأقل.');
                return;
            }

            let orderData = {
                bowls: selectedBowls,
                addons: selectedAddons,
                date: new Date().toLocaleString()
            };

            // إرسال الطلب إلى السيرفر (مسار الـ API المفترض في server.js)
            fetch('/api/orders', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(orderData)
            })
            .then(res => res.json())
            .then(data => {
                alert('تم إرسال طلبك بنجاح!');
                location.reload();
            })
            .catch(err => {
                alert('حدث خطأ أثناء إرسال الطلب، تأكد من تشغيل السيرفر.');
            });
        }

        // فتح لوحة الآدمن بكلمة السر 1234
        function openAdminLogin() {
            let pass = prompt('الرجاء إدخال كلمة السر لصفحة الآدمن:');
            if (pass === '1234') {
                document.getElementById('admin-panel').style.display = 'flex';
                fetchOrders();
            } else if (pass !== null) {
                alert('كلمة السر غير صحيحة!');
            }
        }

        function closeAdmin() {
            document.getElementById('admin-panel').style.display = 'none';
        }

        // جلب الطلبات من السيرفر لعرضها للآدمن
        function fetchOrders() {
            fetch('/api/orders')
            .then(res => res.json())
            .then(data => {
                let listDiv = document.getElementById('orders-list');
                if (data.length === 0) {
                    listDiv.innerHTML = '<p>لا توجد طلبات حالياً.</p>';
                    return;
                }
                let html = '<ul>';
                data.forEach((order, index) => {
                    html += `<li><strong>طلب #${index + 1}</strong> (${order.date})<br>`;
                    order.bowls.forEach(b => html += `- ${b.name} (${b.price} درهم)<br>`);
                    if(order.addons.length > 0) {
                        html += `إضافات: `;
                        order.addons.forEach(a => html += `${a.name} `);
                        html += `<br>`;
                    }
                    html += `</li><hr>`;
                });
                html += '</ul>';
                listDiv.innerHTML = html;
            })
            .catch(err => {
                document.getElementById('orders-list').innerHTML = 'فشل جلب الطلبات من السيرفر.';
            });
        }
    </script>
</body>
</html>
